<!DOCTYPE html>
<html>
<head>
<title>Student Record</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
}

.box{
    width:600px;
    margin:auto;
    margin-top:30px;
    background:pink;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h1{
    text-align:center;
    color:darkblue;
}

h3 {
    
    	color:purple;
}
</style>

</head>

<body>

<div class="box">

<h1><u>-: Submitted Student Data :-</u></h1>

<h3>Personal Information :-</h3>
<p><b>Name :</b> <span id="name"></span></p>
<p><b>Father Name :</b> <span id="father"></span></p>
<p><b>Mother Name :</b> <span id="mother"></span></p>
<p><b>Date of Bith :</b> <span id="dob"></span></p>
<p><b>Email id :</b> <span id="email"></span></p>
<p><b>Mobile Number :</b> <span id="mobile"></span></p>
<p><b>Address :</b> <span id="address"></span></p>
<p><b>Pincode :</b> <span id="pincode"></span></p>
<p><b>Category :</b> <span id="category"></span></p>
<p><b>Gender :</b> <span id="gender"></span></p>

<h3>Qualifications Information :-</h3>
<p><b>10th % :</b> <span id="tenth"></span></p>
<p><b>12th % :</b> <span id="twelfth"></span></p>

<h3>ITI Information :-</h3>
<p><b>Admission Date :</b> <span id="admission"></span></p>
<p><b>Institute :</b> <span id="institute"></span></p>
<p><b>Trade :</b> <span id="trade"></span></p>


</div>

<script>

document.getElementById("name").innerHTML = localStorage.getItem("name");
document.getElementById("father").innerHTML = localStorage.getItem("father");
document.getElementById("mother").innerHTML = localStorage.getItem("mother")
document.getElementById("dob").innerHTML = localStorage.getItem("dob")
document.getElementById("email").innerHTML = localStorage.getItem("email")
document.getElementById("mobile").innerHTML = localStorage.getItem("mobile");
document.getElementById("address").innerHTML = localStorage.getItem("address");
document.getElementById("pincode").innerHTML = localStorage.getItem("pincode");

document.getElementById("category").innerHTML = localStorage.getItem("category")
document.getElementById("gender").innerHTML = localStorage.getItem("gender")

document.getElementById("tenth").innerHTML = localStorage.getItem("tenth");
document.getElementById("twelfth").innerHTML = localStorage.getItem("twelfth");

document.getElementById("admission").innerHTML = localStorage.getItem("admission");
document.getElementById("institute").innerHTML = localStorage.getItem("institute");
document.getElementById("trade").innerHTML = localStorage.getItem("trade");

</script>

</body>
</html>
